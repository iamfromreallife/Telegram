name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ master ]

jobs:
  build-apk:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.10.2"
          yes | sdkmanager --licenses >/dev/null || true

      - name: Build bundleAfat debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew :TMessagesProj_App:assembleBundleAfatDebug --no-daemon --stacktrace

      - name: Collect APK
        run: |
          mkdir -p artifacts
          find . -type f -path '*/build/outputs/apk/*.apk' -exec cp {} artifacts/telegram-android-auto-pr2008-debug.apk \;
          test -s artifacts/telegram-android-auto-pr2008-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: telegram-android-auto-pr2008-debug
          path: artifacts/telegram-android-auto-pr2008-debug.apk
          if-no-files-found: error
